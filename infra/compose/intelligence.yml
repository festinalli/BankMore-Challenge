# Overlay: use junto de docker-compose.yml, com os mesmos --env-file e projeto.
# Banco separado: o módulo de IA não recebe credenciais do ledger bancário.
services:
  intelligence-db:
    image: ${INTELLIGENCE_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: intelligence
      POSTGRES_USER: intelligence
      POSTGRES_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?Configure senha}
    volumes: ["intelligence_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelligence -d intelligence"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [bankmore]
  intelligence-api:
    build:
      context: ../../investigation
    depends_on:
      intelligence-db: {condition: service_healthy}
    ports: ["127.0.0.1:5010:5010"]
    environment: &intelligence-environment
      INTELLIGENCE_DATABASE_URL: postgresql+psycopg://intelligence:${INTELLIGENCE_DB_PASSWORD}@intelligence-db:5432/intelligence
      INTELLIGENCE_IDENTITIES: ${INTELLIGENCE_IDENTITIES:?Configure identidades}
      INTELLIGENCE_PSEUDONYM_KEY: ${INTELLIGENCE_PSEUDONYM_KEY:?Configure chave}
      INTELLIGENCE_MODE: ${INTELLIGENCE_MODE:-demo}
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-embeddinggemma}
      KAFKA_BROKERS: kafka:29092
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: on-failure
    networks: [bankmore]
  intelligence-consumer:
    build:
      context: ../../investigation
    command: ["python", "-m", "bankmore_intelligence.consumer"]
    environment: *intelligence-environment
    depends_on:
      intelligence-db: {condition: service_healthy}
      kafka: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    restart: on-failure
    networks: [bankmore]
volumes:
  intelligence_data:
