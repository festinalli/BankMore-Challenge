name: jev

# Testes do módulo jev/ (antifraude Pix com o Jev, ADR 0022). Só biblioteca padrão;
# nenhum teste chama a TypeSafe nem usa chave.
on:
  push:
    branches: [main]
    paths: ["jev/**", ".github/workflows/jev.yml"]
  pull_request:
    paths: ["jev/**", ".github/workflows/jev.yml"]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest discover -s tests -t . -v
